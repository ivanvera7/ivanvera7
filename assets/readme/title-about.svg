<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-label="Quién hay detrás del terminal">
<title>Quién hay detrás del terminal</title>
<style>
@font-face{font-family:'iv-head';src:url(data:font/woff2;base64,) format('woff2');}
.f-head{font-family:'iv-head',sans-serif;}
@keyframes tin{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}.tt{animation:tin .9s cubic-bezier(.23,1,.32,1) .15s both}@keyframes bin{from{transform:scaleY(0)}}.bb{transform-box:fill-box;transform-origin:bottom;animation:bin .5s cubic-bezier(.23,1,.32,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
<defs><clipPath id="card"><rect width="1200" height="104" rx="16"/></clipPath><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".07"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient><mask id="dotmask"><rect width="1200" height="104" fill="url(#fade)"/></mask></defs>
<g clip-path="url(#card)"><rect width="1200" height="104" fill="#0b0d10"/><rect width="1200" height="104" fill="url(#dots)" mask="url(#dotmask)"/>
<defs><linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#4cc38a" stop-opacity=".10"/><stop offset=".45" stop-color="#4cc38a" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="104" fill="url(#sheen)"/>
<rect class="bb" x="36" y="36" width="11" height="32" rx="2.5" fill="#4cc38a"/>
<text class="f-head tt" x="66" y="67" font-size="42" letter-spacing="-1.47" fill="#eceef1"><tspan>Quién hay detrás del terminal</tspan></text>
</g>
<rect x=".75" y=".75" width="1198.5" height="102.5" rx="15.25" fill="none" stroke="#2b313a" stroke-width="1.5"/>
</svg>
